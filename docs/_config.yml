title: T
description: A developer, hardware tinkerer, and astronomy enthusiast from Slovakia
url: "https://jan-tdy.github.io"
baseurl: "/jan-tdy"

# Core Build settings
markdown: kramdown
highlighter: rouge

# Plugins (Bypassing remote_theme completely)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: projects
    values:
      layout: project
