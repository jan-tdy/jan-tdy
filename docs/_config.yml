title: Ján Dubovský - Developer & Astronomer
description: A developer, hardware tinkerer, and astronomy enthusiast from Slovakia
url: https://jan-tdy.github.io
baseurl: /jan-tdy

# Theme
theme: jekyll-theme-slate

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Build settings
markdown: kramdown
highlighter: rouge

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
