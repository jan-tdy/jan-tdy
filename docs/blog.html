---
layout: default
---

<h1>Recent Posts</h1>
<ul>
    <!-- Jekyll automatically loops through the _posts directory -->
    {% for post in site.posts %}
        <li>
            <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
            <span class="post-date">{{ post.date | date: "%B %d, %Y" }}</span>
        </li>
    {% endfor %}
</ul>

<style>
    .post-link { text-decoration: none; color: #58a6ff; font-size: 1.25rem; font-weight: bold; }
    .post-link:hover { text-decoration: underline; }
    .post-date { color: #8b949e; font-size: 0.9rem; margin-left: 10px; }
    ul { list-style: none; padding: 0; }
    li { margin-bottom: 20px; }
</style>
