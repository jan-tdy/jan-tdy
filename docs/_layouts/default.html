<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            line-height: 1.6;
        }

        /* Topbar Navigation */
        nav {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        nav .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }

        nav .logo {
            font-size: 20px;
            font-weight: bold;
            color: #58a6ff;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        nav .logo:hover {
            color: #79c0ff;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav ul li a {
            color: #c9d1d9;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
        }

        nav ul li a:hover {
            color: #58a6ff;
            border-bottom-color: #58a6ff;
        }

        nav ul li a.active {
            color: #58a6ff;
            border-bottom-color: #58a6ff;
        }

        /* Main Content */
        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.25;
            color: #f0f6fc;
        }

        h1 {
            font-size: 32px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }

        h2 {
            font-size: 24px;
        }

        h3 {
            font-size: 20px;
        }

        p {
            margin-bottom: 16px;
        }

        a {
            color: #58a6ff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Code blocks */
        code {
            background-color: #161b22;
            color: #79c0ff;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        pre {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            overflow-x: auto;
            margin-bottom: 16px;
        }

        pre code {
            background-color: transparent;
            color: #c9d1d9;
            padding: 0;
        }

        /* Lists */
        ul, ol {
            margin-left: 20px;
            margin-bottom: 16px;
        }

        li {
            margin-bottom: 8px;
        }

        /* Images */
        img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
        }

        /* Blockquotes */
        blockquote {
            border-left: 4px solid #30363d;
            padding: 0 12px;
            color: #8b949e;
            margin: 0 0 16px 0;
        }

        @media (max-width: 768px) {
            nav ul {
                gap: 15px;
            }

            nav ul li a {
                font-size: 12px;
            }

            h1 {
                font-size: 24px;
            }

            h2 {
                font-size: 20px;
            }

            main {
                padding: 0 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="container">
            <a href="/jan-tdy/" class="logo">Ján</a>
            <ul>
                <li><a href="/jan-tdy/" {% if page.url == '/' %}class="active"{% endif %}>Home</a></li>
                <li><a href="/jan-tdy/projects" {% if page.url == '/projects' %}class="active"{% endif %}>Projects</a></li>
                <li><a href="/jan-tdy/contact" {% if page.url == '/contact' %}class="active"{% endif %}>Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        {{ content }}
    </main>
</body>
</html>
