---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #333; }
        header { margin-bottom: 40px; }
        h1 { margin-bottom: 5px; color: #111; }
        .date { color: #666; font-style: italic; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #0066cc; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <a href="{{ '/' | relative_url }}" class="back-link">← Back to Home</a>

    <header>
        <h1>{{ page.title }}</h1>
        <span class="date">{{ page.date | date: "%B %d, %Y" }}</span>
    </header>

    <main>
        <!-- {{ content }} injection is where your Markdown content gets parsed into HTML -->
        {{ content }}
    </main>

</body>
</html>
