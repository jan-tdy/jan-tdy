---
layout: default
---

<article>
    <header>
        <h1>{{ page.title }}</h1>
        <p class="post-date">{{ page.date | date: "%B %d, %Y" }}</p>
        <nav>
            <a href="{{ site.baseurl }}/blog.html">← Back to Blog</a>
        </nav>
    </header>

    <main>
        {{ content }}
    </main>
</article>

<style>
    article header { border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 30px; }
    h1 { margin: 0; }
    .post-date { color: #666; font-size: 0.9rem; margin: 10px 0; }
    nav a { color: #0066cc; text-decoration: none; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
</style>
