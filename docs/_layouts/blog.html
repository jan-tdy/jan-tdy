---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
        header { border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { margin: 0; color: #111; }
        .post-link { text-decoration: none; color: #0066cc; font-size: 1.25rem; font-weight: bold; }
        .post-link:hover { text-decoration: underline; }
        .post-date { color: #666; font-size: 0.9rem; margin-left: 10px; }
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>{{ site.title }}</h1>
        <p>{{ site.description }}</p>
    </header>

    <main>
        <h2>Recent Posts</h2>
        <ul>
            <!-- Jekyll automatically loops through the _posts directory -->
            {% for post in site.posts %}
                <li>
                    <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
                    <span class="post-date">{{ post.date | date: "%B %d, %Y" }}</span>
                </li>
            {% endfor %}
        </ul>
    </main>

</body>
</html>
